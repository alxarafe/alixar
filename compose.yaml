services:
  database:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ${ALIXAR_DB_NAME:-alixar}
      POSTGRES_USER: ${ALIXAR_DB_USER:-alixar}
      POSTGRES_PASSWORD: ${ALIXAR_DB_PASSWORD:-alixar}
    volumes:
      - alixar-db-data:/var/lib/postgresql
    networks:
      - alixar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALIXAR_DB_USER:-alixar} -d ${ALIXAR_DB_NAME:-alixar}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${ALIXAR_JAVA_PORT:-48081}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${ALIXAR_DB_NAME:-alixar}
      SPRING_DATASOURCE_USERNAME: ${ALIXAR_DB_USER:-alixar}
      SPRING_DATASOURCE_PASSWORD: ${ALIXAR_DB_PASSWORD:-alixar}
      SPRING_JOOQ_SQL_DIALECT: POSTGRES
      ALIXAR_SESSION_COOKIE_SECURE: ${ALIXAR_SESSION_COOKIE_SECURE:-false}
      ALIXAR_SESSION_TIMEOUT: ${ALIXAR_SESSION_TIMEOUT:-30m}
      ALIXAR_BOOTSTRAP_USERNAME: ${ALIXAR_BOOTSTRAP_USERNAME:-}
      ALIXAR_BOOTSTRAP_EMAIL: ${ALIXAR_BOOTSTRAP_EMAIL:-}
      ALIXAR_BOOTSTRAP_PASSWORD: ${ALIXAR_BOOTSTRAP_PASSWORD:-}
      # Password reset: frontend URL and optional SMTP delivery. Mail settings
      # are passed through from the host environment only when defined, so no
      # mail sender is configured unless an operator opts in. Never commit real
      # mail credentials; provide them through the environment.
      ALIXAR_PASSWORD_RESET_FRONTEND_URL: ${ALIXAR_PASSWORD_RESET_FRONTEND_URL:-}
      ALIXAR_PASSWORD_RESET_MAIL_FROM:
      SPRING_MAIL_HOST:
      SPRING_MAIL_PORT:
      SPRING_MAIL_USERNAME:
      SPRING_MAIL_PASSWORD:
      SPRING_MAIL_AUTH:
      SPRING_MAIL_STARTTLS_ENABLE:
    networks:
      - alixar-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

networks:
  alixar-network:
    driver: bridge
    internal: false

volumes:
  alixar-db-data:
