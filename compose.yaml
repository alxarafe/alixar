services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alixar-app
    ports:
      - "127.0.0.1:${ALIXAR_JAVA_PORT:-48081}:8080"
    networks:
      - alixar-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

networks:
  alixar-network:
    driver: bridge
    internal: false