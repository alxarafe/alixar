services:
  database:
    image: postgres:18.6-alpine
    container_name: alixar-database
    environment:
      POSTGRES_DB: ${ALIXAR_DB_NAME:-alixar}
      POSTGRES_USER: ${ALIXAR_DB_USER:-alixar}
      POSTGRES_PASSWORD: ${ALIXAR_DB_PASSWORD:-alixar}
    volumes:
      - alixar-db-data:/var/lib/postgresql
    networks:
      - alixar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALIXAR_DB_USER:-alixar} -d ${ALIXAR_DB_NAME:-alixar}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alixar-app
    ports:
      - "127.0.0.1:${ALIXAR_JAVA_PORT:-48081}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${ALIXAR_DB_NAME:-alixar}
      SPRING_DATASOURCE_USERNAME: ${ALIXAR_DB_USER:-alixar}
      SPRING_DATASOURCE_PASSWORD: ${ALIXAR_DB_PASSWORD:-alixar}
      SPRING_JOOQ_SQL_DIALECT: POSTGRES
    networks:
      - alixar-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

networks:
  alixar-network:
    driver: bridge
    internal: false

volumes:
  alixar-db-data: