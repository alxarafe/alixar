id: 006
title: Audit Log with HasAuditLog Trait
app: alixar
date: 2026-03-04
priority: low
category: feature
description: |
  A trait HasAuditLog for models that automatically logs who did what, when, and on which record.
  Stores entries in an audit_logs table with fields: user_id, model_type, model_id, action
  (created/updated/deleted), old_values, new_values, ip_address, timestamp. Should be opt-in
  per model and not affect performance when not used.
use_case: |
  Any business application needs traceability: who modified an invoice, when was a record deleted.
  Alixar requires this for regulatory compliance (invoicing) and general ERP auditability.
