id: 003
title: Email Service with SMTP Configuration
app: alixar
date: 2026-03-04
priority: high
category: feature
description: |
  A generic EmailService providing EmailService::send($to, $subject, $body) with SMTP configuration
  managed via ConfigController (host, port, user, password, encryption). This is a core framework
  need — password reset already requires it. Should support both plain text and HTML emails.
use_case: |
  Any Alxarafe application needs to send transactional emails: password resets, notifications,
  workflow status changes. Currently there is no email service in the framework.
