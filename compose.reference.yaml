services:
  app:
    container_name: alixar-reference
    environment:
      - ALIXAR_DOLIBARR_BASE_URL=http://dolibarr/api/index.php
      - ALIXAR_DOLIBARR_API_KEY=${ALIXAR_DOLIBARR_API_KEY:?ALIXAR_DOLIBARR_API_KEY is required}
    networks:
      - alixar-network
      - reference-network

networks:
  reference-network:
    external: true
    name: ${DOLIBARR_REFERENCE_NETWORK:?DOLIBARR_REFERENCE_NETWORK is required}
