name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-check:
    name: Docker validation
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Run full validation
        run: ./bin/check