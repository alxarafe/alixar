# Test configuration - disable persistence auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.springframework.boot.jooq.autoconfigure.JooqAutoConfiguration

# Flowable is a test-scoped compatibility spike. It must never start implicitly
# in ordinary tests or in the Alixar runtime. FlowableCompatibilityIT enables
# only the process engine in an isolated context with its own PostgreSQL schema.
flowable.app.enabled=false
flowable.cmmn.enabled=false
flowable.dmn.enabled=false
flowable.eventregistry.enabled=false
flowable.idm.enabled=false
flowable.db-identity-used=false
flowable.process.enabled=false
flowable.async-executor-activate=false
flowable.async-history-executor-activate=false
flowable.check-process-definitions=false
flowable.database-schema-update=false
flowable.rest-api-enabled=false

