# Dolibarr integration configuration
# These must be provided via environment variables
# alixar.dolibarr.base-url=${ALIXAR_DOLIBARR_BASE_URL}
# alixar.dolibarr.api-key=${ALIXAR_DOLIBARR_API_KEY}

# PostgreSQL datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alixar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alixar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alixar}
spring.datasource.driver-class-name=org.postgresql.Driver

# jOOQ configuration
spring.jooq.sql-dialect=${SPRING_JOOQ_SQL_DIALECT:POSTGRES}

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false