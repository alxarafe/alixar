# PostgreSQL datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alixar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alixar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alixar}
spring.datasource.driver-class-name=org.postgresql.Driver

# jOOQ configuration
spring.jooq.sql-dialect=${SPRING_JOOQ_SQL_DIALECT:POSTGRES}

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Session authentication configuration
server.servlet.session.timeout=${ALIXAR_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ALIXAR_SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Optional one-time user bootstrap for development and testing.
# The bootstrap user is NOT an administrator unless system-admin is explicitly
# enabled. It only grants the built-in system-admin role to that user.
alixar.authentication.bootstrap.username=${ALIXAR_BOOTSTRAP_USERNAME:}
alixar.authentication.bootstrap.email=${ALIXAR_BOOTSTRAP_EMAIL:}
alixar.authentication.bootstrap.password=${ALIXAR_BOOTSTRAP_PASSWORD:}
alixar.authentication.bootstrap.system-admin=${ALIXAR_BOOTSTRAP_SYSTEM_ADMIN:false}

# Audit bootstrap mode. OFF disables persistent audit events. BASIC records only
# the events explicitly instrumented as basic events; it is not full coverage.
# This value is used only when no persisted audit configuration exists. Once
# persisted, the database configuration is authoritative and this value is
# ignored.
alixar.audit.mode=${ALIXAR_AUDIT_MODE:OFF}

# Password reset configuration
# Base URL of the frontend page that accepts the reset token. No frontend is
# hardcoded; it must be provided by deployment configuration.
alixar.authentication.password-reset.frontend-url=${ALIXAR_PASSWORD_RESET_FRONTEND_URL:}

# Password reset email delivery (optional).
# When a standard Spring mail host is configured (SPRING_MAIL_HOST, or
# spring.mail.host), reset emails are sent by the SMTP adapter. When no mail
# host is configured, the application falls back to a no-op notifier.
# Credentials must come from external configuration; never hardcode them here.
alixar.authentication.password-reset.mail.from=${ALIXAR_PASSWORD_RESET_MAIL_FROM:}
