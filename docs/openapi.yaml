openapi: 3.0.3
info:
  title: Alixar ERP API
  description: |
    Documentación completa de la API REST de **Alixar ERP**.

    La API está organizada en dos capas:
    - **`/api/v1/*`** — API nativa de Alixar (arquitectura hexagonal, plugins modulares).
    - **`/api/*`** — Capa de compatibilidad Dolibarr (Anti-Corruption Layer para migración progresiva).

    ### Autenticación
    La mayoría de los endpoints requieren autenticación mediante un **JWT Bearer Token**.
    Los endpoints legacy también aceptan la cabecera `DOLAPIKEY` para compatibilidad con Dolibarr.

    ### Endpoints públicos (sin autenticación)
    - `POST /api/auth/login`
    - `GET /api/status`
    - `GET /api/i18n/*`
  version: 1.0.0
  contact:
    name: Alixar Team
    url: https://github.com/alxarafe/alixar
  license:
    name: GPL-3.0-or-later

servers:
  - url: /
    description: Servidor principal

tags:
  # ── Core ──
  - name: System
    description: Estado del sistema y configuración
  - name: Auth
    description: Autenticación y sesión
  - name: Users
    description: Gestión de usuarios
  - name: Roles
    description: Roles y permisos
  - name: i18n
    description: Internacionalización y traducciones
  - name: Tenants
    description: Multi-tenancy

  # ── Business ──
  - name: ThirdParties
    description: Terceros (clientes, proveedores, prospects)
  - name: Categories
    description: Categorías de entidades

  # ── CRM ──
  - name: Contacts
    description: Contactos / Direcciones
  - name: Events
    description: Eventos de agenda
  - name: Tickets
    description: Tickets de soporte

  # ── Trading ──
  - name: Invoices
    description: Facturas de cliente
  - name: Proposals
    description: Presupuestos
  - name: Orders
    description: Pedidos de cliente
  - name: Contracts
    description: Contratos
  - name: SupplierInvoices
    description: Facturas de proveedor
  - name: SupplierOrders
    description: Pedidos de proveedor
  - name: SupplierProposals
    description: Presupuestos de proveedor

  # ── Products ──
  - name: Products
    description: Productos y servicios
  - name: ProductLots
    description: Lotes de producto

  # ── Projects ──
  - name: Projects
    description: Proyectos
  - name: Tasks
    description: Tareas de proyecto

  # ── Finance ──
  - name: BankAccounts
    description: Cuentas bancarias de tesorería
  - name: Payments
    description: Pagos
  - name: Accountancy
    description: Contabilidad
  - name: Donations
    description: Donaciones
  - name: Multicurrency
    description: Multi-divisa

  # ── HR ──
  - name: ExpenseReports
    description: Notas de gastos
  - name: Holidays
    description: Vacaciones / Permisos
  - name: Salaries
    description: Nóminas
  - name: Recruitments
    description: Reclutamiento

  # ── Logistics ──
  - name: Shipments
    description: Expediciones / Envíos
  - name: Receptions
    description: Recepciones
  - name: Warehouses
    description: Almacenes
  - name: StockMovements
    description: Movimientos de stock

  # ── Interventions ──
  - name: Interventions
    description: Intervenciones / Servicios

  # ── MRP ──
  - name: BOMs
    description: Listas de materiales
  - name: ManufacturingOrders
    description: Órdenes de fabricación
  - name: Workstations
    description: Puestos de trabajo

  # ── Members ──
  - name: Members
    description: Miembros / Socios
  - name: MemberTypes
    description: Tipos de miembro
  - name: Subscriptions
    description: Suscripciones de miembro

  # ── System Integrations ──
  - name: Documents
    description: Documentos adjuntos
  - name: EmailTemplates
    description: Plantillas de email
  - name: KnowledgeManagement
    description: Base de conocimientos
  - name: ObjectLinks
    description: Vínculos entre entidades
  - name: Webhooks
    description: Webhooks
  - name: Zapier
    description: Integración Zapier

  # ── Legacy ──
  - name: Legacy
    description: Endpoints legacy de compatibilidad Dolibarr (/api/*)

components:
  securitySchemes:
    JwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido via POST /api/auth/login
    ApiKeyAuth:
      type: apiKey
      in: header
      name: DOLAPIKEY
      description: Clave API de Dolibarr (compatibilidad legacy)

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID numérico del recurso
    LineIdParam:
      name: lineId
      in: path
      required: true
      schema:
        type: integer
      description: ID de la línea del documento
    ContactIdParam:
      name: contactid
      in: path
      required: true
      schema:
        type: integer
      description: ID del contacto
    TypeParam:
      name: type
      in: path
      required: true
      schema:
        type: string
      description: Tipo de relación del contacto
    RefParam:
      name: ref
      in: path
      required: true
      schema:
        type: string
      description: Referencia del recurso
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
      description: Número máximo de resultados
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 0
      description: Página de resultados (0-indexed)
    SortFieldParam:
      name: sortfield
      in: query
      schema:
        type: string
      description: Campo por el que ordenar
    SortOrderParam:
      name: sortorder
      in: query
      schema:
        type: string
        enum: [ASC, DESC]
      description: Orden de los resultados

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    Unauthorized:
      description: No autenticado
    ValidationError:
      description: Error de validación (422)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

security:
  - JwtAuth: []

# ═══════════════════════════════════════════════════════════════════
# PATHS
# ═══════════════════════════════════════════════════════════════════
paths:

  # ────────────────────────────────────────────────────────────────
  # CORE: System
  # ────────────────────────────────────────────────────────────────
  /api/status:
    get:
      tags: [System]
      summary: Estado del sistema
      description: Devuelve el estado del servicio API. No requiere autenticación.
      security: []
      responses:
        '200':
          description: Sistema operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  version:
                    type: string

  /api/setup/menus:
    get:
      tags: [System]
      summary: Árbol de navegación
      description: Devuelve el árbol de menús para el frontend SPA.
      responses:
        '200':
          description: Árbol de menús en formato JSON

  /api/setup/schemas:
    get:
      tags: [System]
      summary: Esquemas JSON de todas las entidades
      description: Devuelve los esquemas JSON de los formularios de cada plugin activo.
      responses:
        '200':
          description: Mapa de esquemas por entidad

  /api/setup/plugins:
    get:
      tags: [System]
      summary: Introspección de plugins
      description: Devuelve la lista de plugins descubiertos con su estado de activación.
      responses:
        '200':
          description: Lista de plugins

  # ────────────────────────────────────────────────────────────────
  # CORE: Auth
  # ────────────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin
      responses:
        '200':
          description: Login correcto, devuelve token JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
        '401':
          description: Credenciales incorrectas

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      responses:
        '200':
          description: Sesión cerrada

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Obtener usuario actual
      responses:
        '200':
          description: Datos del usuario autenticado

  # ────────────────────────────────────────────────────────────────
  # CORE: Users
  # ────────────────────────────────────────────────────────────────
  /api/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Lista de usuarios
    post:
      tags: [Users]
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                password:
                  type: string
                email:
                  type: string
                firstname:
                  type: string
                lastname:
                  type: string
      responses:
        '201':
          description: Usuario creado

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Users]
      summary: Obtener usuario por ID
      responses:
        '200':
          description: Datos del usuario
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Actualizar usuario
      responses:
        '200':
          description: Usuario actualizado
    delete:
      tags: [Users]
      summary: Eliminar usuario
      responses:
        '200':
          description: Usuario eliminado

  /api/users/{id}/roles:
    put:
      tags: [Users]
      summary: Asignar roles a un usuario
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Roles asignados

  # ────────────────────────────────────────────────────────────────
  # CORE: Roles & Permissions
  # ────────────────────────────────────────────────────────────────
  /api/roles:
    get:
      tags: [Roles]
      summary: Listar roles
      responses:
        '200':
          description: Lista de roles
    post:
      tags: [Roles]
      summary: Crear rol
      responses:
        '201':
          description: Rol creado

  /api/roles/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Roles]
      summary: Obtener rol por ID
      responses:
        '200':
          description: Datos del rol
    put:
      tags: [Roles]
      summary: Actualizar rol
      responses:
        '200':
          description: Rol actualizado
    delete:
      tags: [Roles]
      summary: Eliminar rol
      responses:
        '200':
          description: Rol eliminado

  /api/roles/{id}/permissions:
    put:
      tags: [Roles]
      summary: Sincronizar permisos de un rol
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Permisos sincronizados

  /api/permissions:
    get:
      tags: [Roles]
      summary: Listar todos los permisos
      responses:
        '200':
          description: Lista de permisos

  /api/permissions/{plugin}:
    get:
      tags: [Roles]
      summary: Listar permisos de un plugin
      parameters:
        - name: plugin
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Permisos del plugin

  # ────────────────────────────────────────────────────────────────
  # CORE: i18n
  # ────────────────────────────────────────────────────────────────
  /api/i18n/locales:
    get:
      tags: [i18n]
      summary: Listar idiomas disponibles
      security: []
      responses:
        '200':
          description: Lista de locales

  /api/i18n/{locale}:
    get:
      tags: [i18n]
      summary: Obtener traducciones por idioma
      security: []
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
          example: es
      responses:
        '200':
          description: Traducciones del idioma

  /api/i18n/{locale}/{group}:
    get:
      tags: [i18n]
      summary: Obtener traducciones por idioma y grupo
      security: []
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
        - name: group
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Traducciones del grupo

  /api/i18n/{locale}/{group}/{key}:
    put:
      tags: [i18n]
      summary: Actualizar una traducción
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
        - name: group
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Traducción actualizada

  # ────────────────────────────────────────────────────────────────
  # CORE: Tenants
  # ────────────────────────────────────────────────────────────────
  /api/tenants:
    get:
      tags: [Tenants]
      summary: Listar tenants
      responses:
        '200':
          description: Lista de tenants
    post:
      tags: [Tenants]
      summary: Crear tenant
      responses:
        '201':
          description: Tenant creado

  /api/tenants/{id}:
    get:
      tags: [Tenants]
      summary: Obtener tenant por ID
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Datos del tenant

  /api/tenants/{id}/users:
    post:
      tags: [Tenants]
      summary: Añadir usuario a un tenant
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Usuario añadido al tenant

  # ════════════════════════════════════════════════════════════════
  # PLUGIN: Business — ThirdParties (native v1)
  # ════════════════════════════════════════════════════════════════
  /api/v1/thirdparties:
    get:
      tags: [ThirdParties]
      summary: Listar terceros
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SortFieldParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - name: mode
          in: query
          schema:
            type: integer
            enum: [0, 1, 2, 3]
          description: "0=todos, 1=clientes, 2=prospects, 3=proveedores"
      responses:
        '200':
          description: Lista de terceros
    post:
      tags: [ThirdParties]
      summary: Crear tercero
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                client:
                  type: integer
                fournisseur:
                  type: integer
                email:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                zip:
                  type: string
                town:
                  type: string
                country_id:
                  type: integer
      responses:
        '200':
          description: ID del tercero creado
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/thirdparties/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [ThirdParties]
      summary: Obtener tercero por ID
      responses:
        '200':
          description: Datos del tercero
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ThirdParties]
      summary: Actualizar tercero
      responses:
        '200':
          description: Tercero actualizado
    delete:
      tags: [ThirdParties]
      summary: Eliminar tercero
      responses:
        '200':
          description: Tercero eliminado

  /api/v1/thirdparties/{id}/bankaccounts:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [ThirdParties]
      summary: Listar cuentas bancarias del tercero
      responses:
        '200':
          description: Lista de cuentas bancarias
    post:
      tags: [ThirdParties]
      summary: Crear cuenta bancaria del tercero
      responses:
        '200':
          description: Cuenta bancaria creada

  /api/v1/thirdparties/{id}/bankaccounts/{bankaccountId}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
      - name: bankaccountId
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [ThirdParties]
      summary: Actualizar cuenta bancaria
      responses:
        '200':
          description: Cuenta bancaria actualizada
    delete:
      tags: [ThirdParties]
      summary: Eliminar cuenta bancaria
      responses:
        '200':
          description: Cuenta bancaria eliminada

  /api/v1/thirdparties/{id}/categories:
    get:
      tags: [ThirdParties]
      summary: Obtener categorías del tercero (cliente)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Categorías del tercero

  /api/v1/thirdparties/{id}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [ThirdParties]
      summary: Asignar categoría al tercero
      responses:
        '200':
          description: Categoría asignada
    delete:
      tags: [ThirdParties]
      summary: Desasignar categoría del tercero
      responses:
        '200':
          description: Categoría desasignada

  /api/v1/thirdparties/{id}/supplier_categories:
    get:
      tags: [ThirdParties]
      summary: Obtener categorías de proveedor
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Categorías de proveedor

  /api/v1/thirdparties/{id}/supplier_categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [ThirdParties]
      summary: Asignar categoría proveedor
      responses:
        '200':
          description: Categoría proveedor asignada
    delete:
      tags: [ThirdParties]
      summary: Desasignar categoría proveedor
      responses:
        '200':
          description: Categoría proveedor desasignada

  /api/v1/thirdparties/{id}/representatives:
    get:
      tags: [ThirdParties]
      summary: Obtener representantes comerciales
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Lista de representantes

  /api/v1/thirdparties/{id}/representatives/{userId}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
      - name: userId
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [ThirdParties]
      summary: Asignar representante comercial
      responses:
        '200':
          description: Representante asignado
    delete:
      tags: [ThirdParties]
      summary: Desasignar representante comercial
      responses:
        '200':
          description: Representante desasignado

  /api/v1/thirdparties/{id}/generateBankAccountDocument/{companybankid}:
    get:
      tags: [ThirdParties]
      summary: Generar documento de cuenta bancaria (RIB/IBAN)
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: companybankid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Documento generado

  /api/v1/thirdparties/{id}/merge/{idtodelete}:
    put:
      tags: [ThirdParties]
      summary: Fusionar dos terceros
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: idtodelete
          in: path
          required: true
          schema:
            type: integer
          description: ID del tercero a absorber y eliminar
      responses:
        '200':
          description: Terceros fusionados

  # ════════════════════════════════════════════════════════════════
  # PLUGIN: CRM — Contacts
  # ════════════════════════════════════════════════════════════════
  /api/v1/contacts:
    get:
      tags: [Contacts]
      summary: Listar contactos
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SortFieldParam'
        - $ref: '#/components/parameters/SortOrderParam'
      responses:
        '200':
          description: Lista de contactos
    post:
      tags: [Contacts]
      summary: Crear contacto
      responses:
        '200':
          description: Contacto creado

  /api/v1/contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Contacts]
      summary: Obtener contacto por ID
      responses:
        '200':
          description: Datos del contacto
    put:
      tags: [Contacts]
      summary: Actualizar contacto
      responses:
        '200':
          description: Contacto actualizado
    delete:
      tags: [Contacts]
      summary: Eliminar contacto
      responses:
        '200':
          description: Contacto eliminado

  /api/v1/contacts/email/{email}:
    get:
      tags: [Contacts]
      summary: Buscar contacto por email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contacto encontrado

  /api/v1/contacts/{id}/createUser:
    post:
      tags: [Contacts]
      summary: Crear usuario a partir del contacto
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Usuario creado

  /api/v1/contacts/{id}/categories:
    get:
      tags: [Contacts]
      summary: Obtener categorías del contacto
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Categorías del contacto

  /api/v1/contacts/{id}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Contacts]
      summary: Asignar categoría al contacto
      responses:
        '200':
          description: Categoría asignada
    delete:
      tags: [Contacts]
      summary: Desasignar categoría del contacto
      responses:
        '200':
          description: Categoría desasignada

  # ════════════════════════════════════════════════════════════════
  # PLUGIN: CRM — Events
  # ════════════════════════════════════════════════════════════════
  /api/v1/events:
    get:
      tags: [Events]
      summary: Listar eventos de agenda
      responses:
        '200':
          description: Lista de eventos
    post:
      tags: [Events]
      summary: Crear evento
      responses:
        '200':
          description: Evento creado

  /api/v1/events/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Events]
      summary: Obtener evento por ID
      responses:
